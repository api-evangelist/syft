name: Syft
description: >-
  Syft (originally Syft Online Ltd, later branded "Syft by Indeed") is a
  UK-founded flexible-staffing marketplace launched in London in 2015 by Jack
  Beaman and Novo Abakare. Its platform connects employers across hospitality,
  retail, industrial, care and facilities-management directly with vetted,
  rated temporary and part-time workers, removing the traditional recruitment
  agency and charging a flat fee on top of worker wages. Creandum led Syft's
  Series A in 2017; the company was acquired by Indeed in 2019 and now operates
  as part of Indeed Flex. Syft is a consumer/employer staffing marketplace and
  exposes no public developer API surface.
